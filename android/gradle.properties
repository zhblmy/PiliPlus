# Locale/encoding: the Gradle daemon runs on JDK 17 and its console stream uses the
# platform encoding (GBK on zh-CN Windows). javac writes its notes straight to that
# stream, so localized (zh_CN) javac diagnostics come out as unreadable bytes, and no
# file.encoding / JavaCompile encoding setting can fix it (verified: javac notes stay
# GBK). Forcing the default locale to en_US makes those diagnostics plain ASCII, which
# survives any encoding. The UTF-8 file.encoding below covers build script/text IO.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -Duser.language=en -Duser.country=US
android.useAndroidX=true
android.enableJetifier=true
android.builtInKotlin=false
android.newDsl=false
# Local build fix: pub cache (C:) and project (F:) are on different drives, which makes
# Kotlin's relocatable incremental caches throw "this and base files have different roots".
# See https://github.com/flutter/flutter/issues/173456
kotlin.incremental=false
